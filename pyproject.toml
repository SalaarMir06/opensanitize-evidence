[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opensanitize-evidence"
version = "0.1.0"
description = "Open-source disk sanitization evidence integrity and verification toolkit"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ose = "ose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
